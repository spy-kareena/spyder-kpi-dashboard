# Spyder shipping poller: checks AfterShip every 2 hours for the dashboard's Shipping page.
# Deploy from this folder: npx wrangler deploy   (see README.md here and docs/SHIPPING.md)
name = "spyder-shipping-poller"
main = "index.mjs"
# Same date as the dashboard's root wrangler.toml.
compatibility_date = "2026-10-01"
# No public URL: the Worker only runs on its schedule.
workers_dev = false

[triggers]
# Every 2 hours on the hour, UTC (00:00, 02:00, 04:00 ... 22:00). The page's "next" time and
# functions/api/shipping.js (SCHEDULE in shared/aftership.mjs) assume this schedule.
crons = ["0 */2 * * *"]

# The SAME KV namespace the Pages project binds as REPORT_STORE (shared report, notes, tracking).
# Replace the placeholder with its id: npx wrangler kv namespace list  (or Cloudflare dashboard >
# Storage & Databases > KV), the same id as in the repo's root wrangler.toml. Deploying with the
# placeholder still in place fails on purpose.
[[kv_namespaces]]
binding = "REPORT_STORE"
id = "41f70fd7289e461b87cdf81d45350c74"

# Secret (never put it in this file):
#   npx wrangler secret put AFTERSHIP_API_KEY
# Optional settings: uncomment [vars] and the lines you need.
#   AFTERSHIP_MAX_PER_RUN: numbers read per check (default 150, stalest first).
#   AFTERSHIP_MAX_CALLS: AfterShip requests per check (default 40, under the Workers Free plan's 50 subrequests).
#   On Workers Paid, raise both (up to 600 and 900) to read the whole list every time.
# [vars]
# AFTERSHIP_MAX_PER_RUN = "600"
# AFTERSHIP_MAX_CALLS = "200"
